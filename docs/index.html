<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#E8F0EA">
  <title>Food Букет</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.iconify.design">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">

    <div id="demoBanner" class="demo-banner hidden">
      <span>Демо без сервера · заказы сохраняются в браузере · промокод FLOWERS10</span>
    </div>

    <header id="topbar">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
        <div class="brand-text">
          <div class="brand-name" id="brandName">Food Букет</div>
          <div class="brand-tag" id="brandTag">свежие цветы</div>
        </div>
      </div>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button class="topbar-btn" id="searchBtn" aria-label="Поиск"></button>
    </header>

    <div id="marquee" class="marquee">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>

    <div id="searchBar" class="search-bar hidden">
      <div class="search-inner">
        <span id="searchIcon"></span>
        <input type="text" id="searchInput" placeholder="Поиск букетов…" autocomplete="off">
        <button id="searchClear" class="search-clear hidden">✕</button>
      </div>
    </div>

    <main id="views">
      <section id="view-home" class="view active"></section>
      <section id="view-cart" class="view"></section>
      <section id="view-profile" class="view"></section>
      <section id="view-admin" class="view"></section>
    </main>

    <nav id="bottomnav"></nav>

    <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
    <div id="sheet" class="sheet hidden">
      <div class="sheet-grip"></div>
      <div id="sheet-content" class="sheet-content"></div>
    </div>

    <div id="toasts"></div>

    <div id="splash">
      <div class="splash-bloom" aria-hidden="true"></div>
      <div class="splash-logo">Food <em>Букет</em></div>
      <div class="splash-bar"><i></i></div>
    </div>

    <div id="fatal" class="hidden">
      <div class="fatal-icon" id="fatalIcon"></div>
      <div class="fatal-title" id="fatalTitle"></div>
      <div class="fatal-text" id="fatalText"></div>
    </div>
  </div>

  <script src="js/config.js?v=4"></script>
  <script src="js/icons.js?v=4"></script>
  <script src="js/i18n.js?v=4"></script>
  <script src="js/demo.js?v=4"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
  <script src="js/admin.js?v=4"></script>
</body>
</html>
